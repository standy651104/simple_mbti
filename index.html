<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBTI 十六型人格測驗（30 題）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="mbti.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <div class="page">
    <header class="hero">
      <span class="hero-badge">自我探索 · 30 題</span>
      <h1>MBTI 十六型人格測驗</h1>
      <p class="lead">
        共 30 題，請依直覺勾選最符合的程度。結果說明依據專案內
        <code>MBTI/MBTI_16人格特質總覽.md</code> 整理之人格描述。
      </p>
      <div class="progress-wrap">
        <div
          class="progress-bar"
          id="progressBar"
          role="progressbar"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="30"
          aria-labelledby="progressLabel"
        >
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="progressLabel" class="progress-label" aria-live="polite">已作答 0 / 30</p>
      </div>
    </header>

    <main>
      <section id="quizRoot" class="quiz-section" aria-label="測驗題目"></section>

      <div class="actions">
        <button type="button" id="btnSubmit" class="btn primary" disabled>查看結果</button>
        <button type="button" id="btnReset" class="btn ghost">重新作答</button>
      </div>

      <section id="resultRoot" class="result-section" hidden aria-live="polite"></section>
    </main>

    <footer class="footer">
      <p>僅供自我探索參考，非專業診斷。理論請參閱 MBTI 相關正式資源。</p>
    </footer>
  </div>
  <script src="mbti.js"></script>
</body>
</html>
